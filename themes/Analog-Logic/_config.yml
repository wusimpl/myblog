# Retro-Futurism Theme Configuration
# 复古未来主义主题配置

# 站点信息
author: wusimpl
bio: 爱真理，爱智慧
avatar: /images/icon.png

# 社交链接
social:
  github: https://github.com/wusimpl
  music: https://music.163.com
  email: mailto:your@email.com

# 导航菜单
menu:
  Home: /
  Archives: /archives
  Tags: /tags
